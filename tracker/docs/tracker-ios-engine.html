<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tracker engine</title>
  <link rel="stylesheet" href="ipad.css">
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden}input,textarea,select{font-size:16px}</style>
  <script src="compadre.js"></script>
  <script src="swingjs/swingjs2.js"></script>
  <script src="tracker-ios-bridge.js"></script>
  <script src="tracker-video-convert.js"></script>
</head>
<body writingsuggestions="false">
  <script>
    if (window.J2S) J2S._lang = 'ko';
    if (window.SwingJS) SwingJS.getApplet('Tracker', {
      code: null,
      main: 'org.opensourcephysics.cabrillo.tracker.Tracker',
      core: '_tracker',
      resourceZip: 'misc-assets.zip',
      assets: { name: 'tracker', zipPath: 'tracker-assets.zip', classPaths: ['org/opensourcephysics'] },
      args: ['-adaptive'],
      language: 'ko',
      readyFunction: function () { window.TrackerIOS.initialize(); },
      j2sPath: 'swingjs/j2s',
      console: 'none'
    });
  </script>
</body>
</html>
